<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h4>මැද තියෙන Play බටන් එක ඔබන්න <br> 
        එතකොට වීඩියෝ එක Play වෙයි</h4>
    <div class="video-container">
        <video id="myVideo" controls>
            <source src="videos/video35.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <footer>
        <p id="pageViews">Page views: 0</p>
    </footer>

<script src="script.js"></script>
<script>
    // Page view count logic
    document.addEventListener("DOMContentLoaded", function() {
        let pageViews = localStorage.getItem("pageViews") || 0;
        pageViews = parseInt(pageViews) + 1;
        localStorage.setItem("pageViews", pageViews);
        document.getElementById("pageViews").innerText = `Page views: ${pageViews}`;
    });
</script>
</body>
</html>
